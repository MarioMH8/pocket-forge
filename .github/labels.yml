# Label catalog for MarioMH8/pocket-forge.
#
# kind:* is the hierarchy:
#   epic -> user-story -> task -> subtask
#
# type:* and ready-for:* are only for tasks and subtasks.
# Epics and user stories never carry type:* or ready-for:*.

- name: kind:epic
  color: "6f42c1"
  description: "Top-level body of work. No type:* or ready-for:* labels."

- name: kind:user-story
  color: "1d76db"
  description: "User-facing outcome inside an epic. No type:* or ready-for:* labels."

- name: kind:task
  color: "0e8a16"
  description: "Actionable work inside a user story. Carries type:* and ready-for:*."

- name: kind:subtask
  color: "5319e7"
  description: "Further breakdown of a task. Carries type:* and ready-for:*."

- name: type:feature
  color: "0e8a16"
  description: "Task or subtask: new feature."

- name: type:bug
  color: "b60205"
  description: "Task or subtask: bug fix."

- name: type:chore
  color: "FFFFFF"
  description: "Task or subtask: maintenance, dependencies, tooling."

- name: type:docs
  color: "006b75"
  description: "Task or subtask: documentation only."

- name: type:refactor
  color: "d93f0b"
  description: "Task or subtask: code refactoring with no behavior change."

- name: type:breaking-change
  color: "b60205"
  description: "Task or subtask: breaking API or behavior change."

- name: priority:critical
  color: "d4c5f9"
  description: "Blocking issues, security vulnerabilities."

- name: priority:high
  color: "d4c5f9"
  description: "Important, affects many users."

- name: priority:medium
  color: "d4c5f9"
  description: "Normal priority."

- name: priority:low
  color: "e1957d"
  description: "Nice to have."

- name: status:approved
  color: "c2e0c6"
  description: "Approved for implementation. PRs can be opened."

- name: status:blocked
  color: "e99695"
  description: "Blocked by another issue or external dependency."

- name: status:in-progress
  color: "c5def5"
  description: "Being worked on."

- name: status:needs-review
  color: "f9d0c4"
  description: "Awaiting maintainer review."

- name: status:needs-info
  color: "1d76db"
  description: "Needs more information from the reporter."

- name: status:wont-fix
  color: "000000"
  description: "Out of scope or will not be addressed."

- name: ready-for:agent
  color: "560491"
  description: "Tasks and subtasks only: fully specified, ready for an agent."

- name: ready-for:human
  color: "e99695"
  description: "Tasks and subtasks only: requires human implementation."

- name: dependencies
  color: "0052cc"
  description: "Automated dependency updates."

- name: renovate
  color: "0052cc"
  description: "Renovate automation."

- name: release
  color: "5319e7"
  description: "Release pull request."

- name: internal:sync
  color: "eeeeee"
  description: "Automated main to develop synchronization."

- name: wayfinder:map
  color: "6f42c1"
  description: "Wayfinder planning artifact."

- name: wayfinder:research
  color: "6f42c1"
  description: "Wayfinder planning artifact."

- name: wayfinder:prototype
  color: "6f42c1"
  description: "Wayfinder planning artifact."

- name: wayfinder:grilling
  color: "6f42c1"
  description: "Wayfinder planning artifact."

- name: wayfinder:task
  color: "6f42c1"
  description: "Wayfinder planning artifact."
